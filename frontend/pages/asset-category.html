<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Category — COSTRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css?v=1786348139" />
  <link rel="stylesheet" href="../css/dashboard.css?v=1786348139" />
  <link rel="stylesheet" href="../css/pages.css?v=1786348139" />
  
  <style>
    #modalForm.modal-overlay,
    #modalDelete.modal-overlay {
      display: flex !important;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 9999;
    }
    #modalForm.modal-overlay.active,
    #modalDelete.modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px;">
        <img src="../assets/images/logo.png" alt="COSTRA Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <div class="sidebar-brand">
        <span class="brand-main">COSTRA</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-info">
          <p class="user-name" id="userName">Loading...</p>
          <p class="user-role" id="userRole">-</p>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb" id="breadcrumb">Asset Category</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="logoutBtn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Kategori Asset</h1>
          <p class="page-subtitle">Kelola master data kategori asset</p>
        </div>
        <button class="btn btn-primary" id="btnAdd">
          <i class="fa-solid fa-plus"></i> Tambah Kategori
        </button>
      </div>

      <div class="filter-bar">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="searchInput" placeholder="Cari nama kategori..." />
        </div>
        <button class="btn btn-outline" id="btnRefresh">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table class="data-table" id="categoryTable">
            <thead>
              <tr>
                <th style="width:50px">#</th>
                <th>Nama Kategori</th>
                <th>Deskripsi</th>
                <th style="width:120px">Aksi</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody">
              <tr><td colspan="4" class="table-empty">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer">
          <div class="table-info" id="tableInfo">-</div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalForm">
    <div class="modal modal-md">
      <div class="modal-header">
        <h3 class="modal-title" id="modalFormTitle">Tambah Kategori</h3>
        <button class="modal-close" id="btnCloseForm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="categoryForm">
          <input type="hidden" id="categoryId" />
          <div class="form-grid">
            <div class="form-group full-width">
              <label class="form-label">Nama Kategori <span class="required">*</span></label>
              <input type="text" class="form-input" id="categoryName" placeholder="Contoh: Laptop, Printer, dsb" />
              <span class="form-error" id="nameError"></span>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-input" id="categoryDesc" rows="3" placeholder="Deskripsi singkat..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btnCancelForm">Batal</button>
        <button class="btn btn-primary" id="btnSaveForm">
          <span id="saveBtnText">Simpan</span>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalDelete">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title">Hapus Kategori</h3>
        <button class="modal-close" id="btnCloseDelete"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <p class="confirm-text">Yakin ingin menghapus kategori <strong id="deleteCategoryName"></strong>?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="btnCancelDelete">Batal</button>
        <button class="btn btn-danger" id="btnConfirmDelete">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const BASE_URL = window.location.origin + (window.location.pathname.includes('/Project%20A/') || window.location.pathname.includes('/Project A/') ? '/Project%20A/backend/api' : '/backend/api');
  </script>

  <script src="../js/utils/pdf.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/shared/toast.js"></script>
  <script src="../js/shared/sidebar.js"></script>
  <script src="../js/shared/topbar.js"></script>
  <script src="../js/modules/asset-category/asset-category.js?v=1786348139"></script>

</body>
</html>
