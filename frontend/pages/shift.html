<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSTRA - Shift Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>COSTRA</span>
      </div>
      <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="module-selector">
      <select id="moduleSelect" class="form-control" style="background-color: var(--primary-700); color: white; border: none; font-weight: 500;">
        <option value="helpdesk">Helpdesk</option>
        <option value="cost_control">Cost Control</option>
        <option value="hr">HR</option>
      </select>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb" id="breadcrumb">Shift Management</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="logoutBtn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header" style="justify-content: space-between; align-items: flex-end; padding-bottom: 0;">
        <div style="flex: 1;">
          <h1 class="page-title" id="shiftPageTitle">User Shift List</h1>
          <p class="page-subtitle" id="shiftPageSubtitle">Dashboard • User Shift</p>
          
          <!-- Tabs -->
          <div style="display: flex; gap: 2rem; margin-top: 1.5rem; border-bottom: 2px solid var(--gray-200);">
            <div class="shift-tab active" data-tab="user-shift" style="padding-bottom: 0.75rem; font-weight: 600; cursor: pointer; color: var(--primary-600); border-bottom: 2px solid var(--primary-600); margin-bottom: -2px;">User Shift List</div>
            <div class="shift-tab" data-tab="category" style="padding-bottom: 0.75rem; font-weight: 500; cursor: pointer; color: var(--gray-500);">Shift Category</div>
          </div>
        </div>
        
        <div id="shiftCategoryActions" style="display: none; padding-bottom: 1rem;">
          <button class="btn btn-primary" style="background: #1e293b; color: white;">
            <i class="fa-solid fa-plus"></i> New Shift Category
          </button>
        </div>
      </div>

      <!-- Tab Content: User Shift List -->
      <div id="tabUserShift" class="card" style="overflow: hidden; padding:0; margin-top: 1.5rem;">
        <div class="card-header" style="border-bottom: none; display: flex; gap: 1rem; flex-wrap: wrap; padding: 1.5rem 1.5rem 0.5rem 1.5rem;">
          <div style="position: relative; margin-top: 10px; border: 1px solid var(--gray-300); border-radius: var(--radius-md); padding: 0.25rem 0.75rem; display: flex; align-items: center; min-width: 150px; background: white;">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: var(--gray-500); z-index: 10;">Month</label>
            <input type="month" value="2026-09" style="border: none; outline: none; background: transparent; color: var(--gray-800); font-size: 0.875rem; width: 100%; cursor: pointer;">
          </div>
          
          <div style="position: relative; margin-top: 10px; border: 1px solid #ef4444; border-radius: var(--radius-md); padding: 0.375rem 0.75rem; min-width: 150px; background: white;">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: #ef4444; z-index: 10;">Site</label>
            <select style="border: none; outline: none; background: transparent; color: var(--gray-700); font-size: 0.875rem; width: 100%; appearance: none; -moz-appearance: none; -webkit-appearance: none; cursor: pointer; position: relative; z-index: 1;">
              <option value="" disabled selected></option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #ef4444; pointer-events: none; z-index: 2;"></i>
          </div>

          <div style="position: relative; margin-top: 10px; border: 1px solid #ef4444; border-radius: var(--radius-md); padding: 0.375rem 0.75rem; min-width: 150px; background: white;">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: #ef4444; z-index: 10;">User</label>
            <select style="border: none; outline: none; background: transparent; color: var(--gray-700); font-size: 0.875rem; width: 100%; appearance: none; -moz-appearance: none; -webkit-appearance: none; cursor: pointer; position: relative; z-index: 1;">
              <option value="" disabled selected></option>
              <option value="Jude">Jude</option>
              <option value="Yashir">Yashir</option>
              <option value="Jimbo">Jimbo</option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #ef4444; pointer-events: none; z-index: 2;"></i>
          </div>

          <div style="flex: 1; min-width: 200px; position: relative; margin-top: 10px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
            <input type="text" class="form-control" placeholder="Search..." style="padding-left: 36px;">
          </div>
        </div>

        <div class="card-body" style="padding: 0; overflow-x: auto;">
          <table class="att-table">
            <thead>
              <tr id="userShiftHead">
                <th class="sticky-col">User Name</th>
                <!-- Dates will be generated by JS -->
              </tr>
            </thead>
            <tbody id="userShiftBody">
              <tr>
                <td colspan="31" style="text-align: center; padding: 4rem 1rem; color: var(--gray-800); background: #f8fafc;">
                  Please select site or user to see data
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="card-footer" style="display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem; border-top: 1px solid var(--gray-100); padding: 1rem 1.5rem;">
          <div style="font-size: 0.875rem; color: var(--gray-600);">
            0-0 of 0
          </div>
          <div style="display: flex; gap: 1.5rem; color: var(--gray-400);">
            <i class="fa-solid fa-chevron-left" style="cursor: not-allowed;"></i>
            <i class="fa-solid fa-chevron-right" style="cursor: not-allowed;"></i>
          </div>
        </div>
      </div>

      <!-- Tab Content: Shift Category -->
      <div id="tabCategory" class="card" style="overflow: hidden; padding:0; margin-top: 1.5rem; display: none;">
        <div class="card-header" style="border-bottom: none; display: flex; justify-content: flex-end; padding: 1.5rem 1.5rem 0.5rem 1.5rem;">
          <div style="position: relative; min-width: 250px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
            <input type="text" class="form-control" placeholder="Search..." style="padding-left: 36px;">
          </div>
        </div>

        <div class="card-body" style="padding: 0; overflow-x: auto;">
          <table class="att-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Type</th>
                <th>Category</th>
                <th>Code</th>
                <th>Description</th>
                <th>Created</th>
                <th>Updated</th>
                <th style="width: 50px;"></th>
              </tr>
            </thead>
            <tbody id="shiftCategoryBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
        
        <div class="card-footer" style="display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem; border-top: 1px solid var(--gray-100); padding: 1rem 1.5rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--gray-600);">
            Rows per page: 
            <select style="border:none; outline:none; background:transparent; font-size: 0.875rem; color: var(--gray-900); cursor: pointer;">
              <option>10</option>
            </select>
          </div>
          <div style="font-size: 0.875rem; color: var(--gray-600);">
            1-10 of 11
          </div>
          <div style="display: flex; gap: 1.5rem; color: var(--gray-400);">
            <i class="fa-solid fa-chevron-left" style="cursor: pointer;"></i>
            <i class="fa-solid fa-chevron-right" style="cursor: pointer; color: var(--gray-900);"></i>
          </div>
        </div>
      </div>
      
      <div style="text-align: right; margin-top: 2rem; font-size: 0.75rem; color: var(--gray-500);">
        PT. Sinergi Teknoglobal Perkasa
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script>const BASE_URL = window.location.origin + '/backend/api';</script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/shared/toast.js"></script>
  <script src="../js/shared/sidebar.js"></script>
  <script src="../js/shared/topbar.js"></script>
  <script src="../js/modules/shift/shift.js"></script>
</body>
</html>
