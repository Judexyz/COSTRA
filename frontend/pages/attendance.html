<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSTRA - Attendance</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>COSTRA</span>
      </div>
      <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="module-selector">
      <select id="moduleSelect" class="form-control" style="background-color: var(--primary-700); color: white; border: none; font-weight: 500;">
        <option value="helpdesk">Helpdesk</option>
        <option value="cost_control">Cost Control</option>
        <option value="hr">HR</option>
      </select>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb" id="breadcrumb">Attendance</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="logoutBtn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header" style="justify-content: space-between; align-items: flex-start;">
        <div>
          <h1 class="page-title">Attendance List</h1>
          <p class="page-subtitle">Dashboard • Attendance</p>
        </div>
        <button class="btn" style="background: #e2e8f0; color: #64748b; border: none; font-weight: 500;">
          <i class="fa-solid fa-download"></i> Download All User Attendance
        </button>
      </div>

      <div class="card" style="overflow: hidden; padding:0;">
        <div class="card-header" style="border-bottom: none; display: flex; gap: 1rem; flex-wrap: wrap; padding: 1.5rem 1.5rem 0.5rem 1.5rem;">
          <!-- Custom Month Picker -->
          <div style="position: relative; margin-top: 10px;" id="customMonthPickerContainer">
            <!-- The input wrapper (Active State as per mockup) -->
            <div id="customMonthPickerBtn" style="border: 1px solid #0284c7; border-radius: var(--radius-md); padding: 0.375rem 0.75rem; display: flex; align-items: center; justify-content: space-between; min-width: 160px; background: white; cursor: pointer;">
              <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: #0284c7; z-index: 10;">Month</label>
              <div style="font-size: 0.875rem; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;">September 2026</div>
              <i class="fa-regular fa-calendar" style="color: var(--gray-500);"></i>
            </div>
            
            <!-- The Popover -->
            <div id="customMonthPickerPopover" class="card" style="position: absolute; top: 100%; left: 0; margin-top: 0.5rem; width: 250px; z-index: 100; padding: 1rem; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); border: 1px solid var(--gray-200);">
              <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--gray-100);">
                <span id="pickerTitle" style="font-weight: 600; color: var(--gray-800); font-size: 0.875rem;">Select Month</span>
              </div>
              
              <!-- Month Grid -->
              <div id="pickerMonthGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center;">
                <div data-month="January" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Jan</div>
                <div data-month="February" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Feb</div>
                <div data-month="March" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Mar</div>
                <div data-month="April" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Apr</div>
                <div data-month="May" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">May</div>
                <div data-month="June" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Jun</div>
                <div data-month="July" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Jul</div>
                <div data-month="August" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Aug</div>
                <div data-month="September" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: white; background-color: #0284c7; border-radius: 9999px;">Sep</div>
                <div data-month="October" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Oct</div>
                <div data-month="November" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Nov</div>
                <div data-month="December" style="cursor: pointer; padding: 0.375rem 0; font-size: 0.875rem; color: var(--gray-700);">Dec</div>
              </div>

              <!-- Year Grid -->
              <div id="pickerYearGrid" style="display: none; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center; max-height: 150px; overflow-y: auto;">
                <!-- Filled by JS -->
              </div>
            </div>
          </div>
          <div style="flex: 1; min-width: 200px; position: relative; margin-top: 10px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
            <input type="text" class="form-control" placeholder="Search..." style="padding-left: 36px;">
          </div>
        </div>

        <div class="card-body" style="padding: 0; overflow-x: auto;">
          <table class="att-table">
            <thead>
              <tr id="attTableHead">
                <th class="sticky-col">User Name</th>
                <!-- Dates will be generated by JS -->
              </tr>
            </thead>
            <tbody id="attTableBody">
              <!-- Rows will be generated by JS -->
            </tbody>
          </table>
        </div>
        
        <div class="card-footer" style="display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem; border-top: 1px solid var(--gray-100); padding: 1rem 1.5rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--gray-600);">
            Rows per page: 
            <select style="border:none; outline:none; background:transparent; font-size: 0.875rem; color: var(--gray-900); cursor: pointer;">
              <option>10</option>
            </select>
          </div>
          <div style="font-size: 0.875rem; color: var(--gray-600);">
            1-10 of 50
          </div>
          <div style="display: flex; gap: 1.5rem; color: var(--gray-400);">
            <i class="fa-solid fa-chevron-left" style="cursor: pointer;"></i>
            <i class="fa-solid fa-chevron-right" style="cursor: pointer; color: var(--gray-900);"></i>
          </div>
        </div>
      </div>
      
      <div style="text-align: right; margin-top: 2rem; font-size: 0.75rem; color: var(--gray-500);">
        Himawari
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script>const BASE_URL = window.location.origin + '/backend/api';</script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/shared/toast.js"></script>
  <script src="../js/shared/sidebar.js"></script>
  <script src="../js/shared/topbar.js"></script>
  <script src="../js/modules/attendance/attendance.js"></script>
</body>
</html>
