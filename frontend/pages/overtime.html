<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSTRA - Overtime</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>COSTRA</span>
      </div>
      <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left" style="display: flex; align-items: center; gap: 1rem;">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb" id="breadcrumb" style="margin-left: 0.5rem;">Overtime</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="logoutBtn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1 class="page-title">Overtime Request</h1>
          <p class="page-subtitle">Dashboard • Overtime Request</p>
        </div>
        <button id="btnRequestOvertime" class="btn btn-primary" style="background: #0ea5e9; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
          <i class="fa-solid fa-plus"></i> Request Overtime
        </button>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <div class="card-header" style="border-bottom: 1px solid var(--gray-200); display: flex; gap: 1rem; flex-wrap: wrap; padding: 1.5rem; background: white;">
          <!-- Date Range Filter -->
          <div style="position: relative; margin-top: 10px;" id="dateRangePickerContainer">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: var(--gray-500); z-index: 10;">Date Range</label>
            <div id="dateRangePickerBtn" style="border: 1px solid var(--gray-300); border-radius: var(--radius-md); padding: 0.375rem 0.75rem; display: flex; align-items: center; min-width: 200px; background: white; cursor: pointer;">
              <i class="fa-regular fa-calendar" style="color: var(--gray-500); margin-right: 0.5rem;"></i>
              <div style="font-size: 0.875rem; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">2026-09-01 to :</div>
            </div>
            
            <!-- Popover for Date Picker -->
            <div id="dateRangePopover" class="card" style="position: absolute; top: 100%; left: 0; margin-top: 0.5rem; width: 300px; z-index: 100; padding: 1rem; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); border: 1px solid var(--gray-200);">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                <span id="pickerMonthYear" style="font-weight: 500; color: var(--gray-800); font-size: 1rem;">September 2026</span>
                <div>
                  <button style="background: none; border: none; color: #0284c7; cursor: pointer; padding: 0 0.5rem;"><i class="fa-solid fa-chevron-left"></i></button>
                  <button style="background: none; border: none; color: #0284c7; cursor: pointer; padding: 0 0.5rem;"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
              </div>
              <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; text-align: center; margin-bottom: 0.5rem;">
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Su</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Mo</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Tu</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">We</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Th</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Fr</div>
                <div style="font-size: 0.75rem; color: var(--gray-500); font-weight: 500;">Sa</div>
              </div>
              <div id="pickerDaysGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; text-align: center;">
                <!-- Generated by JS -->
              </div>
            </div>
          </div>

          <!-- User Filter -->
          <div style="position: relative; margin-top: 10px;">
            <select id="filterUser" class="form-control" style="border-color: var(--gray-300); color: var(--gray-700); padding-right: 2rem; min-width: 150px; appearance: none; -moz-appearance: none; -webkit-appearance: none; position: relative; z-index: 1;">
              <option value="" disabled selected>User</option>
              <option value="Jude">Jude</option>
              <option value="Yashir">Yashir</option>
              <option value="Jimbo">Jimbo</option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-500); pointer-events: none; z-index: 2;"></i>
          </div>

          <!-- Site Filter -->
          <div style="position: relative; margin-top: 10px;">
            <select id="filterSite" class="form-control" style="border-color: var(--gray-300); color: var(--gray-700); padding-right: 2rem; min-width: 150px; appearance: none; -moz-appearance: none; -webkit-appearance: none; position: relative; z-index: 1;">
              <option value="" disabled selected>Site</option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-500); pointer-events: none; z-index: 2;"></i>
          </div>

          <!-- Search Filter -->
          <div style="position: relative; margin-top: 10px; flex: 1; min-width: 200px;">
            <i class="fa-solid fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); z-index: 2;"></i>
            <input type="text" class="form-control" placeholder="Search..." style="padding-left: 2.5rem; width: 100%; border-color: var(--gray-300);">
          </div>
        </div>

        <div class="table-responsive">
          <table class="data-table" style="width: 100%; border-collapse: collapse; margin-bottom: 0;">
            <thead>
              <tr style="background-color: #e0f2fe;">
                <th style="color: #0ea5e9; border-right: 1px solid #bae6fd; padding: 1rem 1.5rem; border-bottom: none;">Name</th>
                <th style="color: #0ea5e9; border-right: 1px solid #bae6fd; padding: 1rem 1.5rem; border-bottom: none;">Site</th>
                <th style="color: #0ea5e9; border-right: 1px solid #bae6fd; padding: 1rem 1.5rem; border-bottom: none;">Approver</th>
                <th style="color: #0ea5e9; border-right: 1px solid #bae6fd; padding: 1rem 1.5rem; border-bottom: none;">Start</th>
                <th style="color: #0ea5e9; border-right: 1px solid #bae6fd; padding: 1rem 1.5rem; border-bottom: none;">End</th>
                <th id="thStatus" style="color: #0ea5e9; padding: 1rem 1.5rem; border-bottom: none;">Status</th>
              </tr>
            </thead>
            <tbody id="overtimeTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
          <div style="display: flex; justify-content: flex-end; align-items: center; padding: 1rem 1.5rem; border-top: 2px solid var(--gray-200); background: white; font-size: 0.75rem; color: var(--gray-600); gap: 1rem;">
            <span>Rows per page: 10 <i class="fa-solid fa-caret-down" style="margin-left: 4px;"></i></span>
            <span>0-0 of 0</span>
            <div style="display: flex; gap: 0.5rem;">
              <button style="background: none; border: none; color: var(--gray-400); cursor: pointer;"><i class="fa-solid fa-chevron-left"></i></button>
              <button style="background: none; border: none; color: var(--gray-400); cursor: pointer;"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div style="text-align: right; margin-top: 2rem; padding-bottom: 1rem; font-size: 0.75rem; color: var(--gray-500);">
        Himawari
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script>const BASE_URL = window.location.origin + '/backend/api';</script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/shared/toast.js"></script>


  <!-- Modal: Request Overtime -->
  <div id="modalRequestOvertime" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div style="background: white; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; transform: scale(0.95); transition: transform 0.2s ease-out;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 1px solid var(--gray-100); background: #f8fafc;">
        <h2 style="font-size: 1.125rem; font-weight: 600; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 0.5rem;"><i class="fa-solid fa-clock" style="color: #0ea5e9;"></i> Request Overtime</h2>
        <button id="closeModalOvertime" style="background: transparent; border: none; font-size: 1.25rem; color: var(--gray-400); cursor: pointer; transition: color 0.2s;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="padding: 1.5rem;">
        <form id="formRequestOvertime">
          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">User</label>
            <input type="text" id="modalInputUser" class="form-control" style="width: 100%; border-radius: 6px; border: 1px solid var(--gray-300); padding: 0.625rem; background-color: var(--gray-100); color: var(--gray-500); cursor: not-allowed;" readonly>
          </div>
          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Date</label>
            <input type="date" id="modalInputDate" class="form-control" style="width: 100%; border-radius: 6px; border: 1px solid var(--gray-300); padding: 0.625rem;" required>
          </div>
          <div style="margin-bottom: 1.25rem; display: flex; gap: 1rem;">
            <div style="flex: 1;">
              <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Start Time</label>
              <input type="time" id="modalInputStart" class="form-control" style="width: 100%; border-radius: 6px; border: 1px solid var(--gray-300); padding: 0.625rem;" required>
            </div>
            <div style="flex: 1;">
              <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">End Time</label>
              <input type="time" id="modalInputEnd" class="form-control" style="width: 100%; border-radius: 6px; border: 1px solid var(--gray-300); padding: 0.625rem;" required>
            </div>
          </div>
          <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Reason (Optional)</label>
            <textarea id="modalInputReason" class="form-control" placeholder="Briefly describe the reason for overtime..." style="width: 100%; min-height: 80px; border-radius: 6px; border: 1px solid var(--gray-300); padding: 0.625rem; font-family: inherit; resize: vertical;"></textarea>
          </div>
        </form>
      </div>
      <div style="padding: 1.25rem 1.5rem; border-top: 1px solid var(--gray-100); display: flex; justify-content: flex-end; gap: 1rem; background: #f8fafc;">
        <button id="cancelModalOvertime" class="btn btn-outline" style="border: 1px solid var(--gray-300); background: white; color: var(--gray-700); padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; cursor: pointer;">Cancel</button>
        <button id="saveModalOvertime" class="btn btn-primary" style="background: #0ea5e9; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-weight: 500; cursor: pointer;">Submit Request</button>
      </div>
    </div>
  </div>

  <script src="../js/shared/sidebar.js"></script>
  <script src="../js/shared/topbar.js"></script>
  <script src="../js/modules/overtime/overtime.js"></script>
</body>
</html>
