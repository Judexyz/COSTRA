<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSTRA - Overtime</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>COSTRA</span>
      </div>
      <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrapper" id="mainWrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left" style="display: flex; align-items: center; gap: 1rem;">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="breadcrumb" id="breadcrumb" style="margin-left: 0.5rem;">Overtime</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="logoutBtn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header" style="justify-content: space-between; align-items: flex-end;">
        <div>
          <h1 class="page-title">Overtime</h1>
          <p class="page-subtitle">Attendance Management • Overtime</p>
        </div>
        <div>
          <button id="btnAddOvertime" class="btn btn-primary" style="background: #1e293b; color: white;">
            <i class="fa-solid fa-plus"></i> Add Overtime
          </button>
        </div>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <div class="card-header" style="border-bottom: none; display: flex; gap: 1rem; flex-wrap: wrap; padding: 1.5rem 1.5rem 0.5rem 1.5rem;">
          <div style="position: relative; margin-top: 10px;">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: #ef4444; z-index: 10;">Status</label>
            <select id="filterStatus" class="form-control" style="border-color: #ef4444; color: var(--gray-700); padding-right: 2rem; min-width: 150px; appearance: none; -moz-appearance: none; -webkit-appearance: none; position: relative; z-index: 1;">
              <option value="All">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Approved">Approved</option>
              <option value="Rejected">Rejected</option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #ef4444; pointer-events: none; z-index: 2;"></i>
          </div>

          <div style="position: relative; margin-top: 10px;">
            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 4px; font-size: 0.75rem; color: #ef4444; z-index: 10;">User</label>
            <select id="filterUser" class="form-control" style="border-color: #ef4444; color: var(--gray-700); padding-right: 2rem; min-width: 150px; appearance: none; -moz-appearance: none; -webkit-appearance: none; position: relative; z-index: 1;">
              <option value="" disabled selected></option>
              <option value="Jude">Jude</option>
              <option value="Yashir">Yashir</option>
              <option value="Jimbo">Jimbo</option>
            </select>
            <i class="fa-solid fa-caret-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #ef4444; pointer-events: none; z-index: 2;"></i>
          </div>

          <div style="position: relative; margin-top: 10px; flex: 1; min-width: 200px;">
            <i class="fa-solid fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); z-index: 2;"></i>
            <input type="text" class="form-control" placeholder="Search..." style="padding-left: 2.5rem; width: 100%;">
          </div>
        </div>

        <div class="table-responsive" style="margin-top: 1rem;">
          <table class="table">
            <thead>
              <tr>
                <th>User</th>
                <th>Date</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="overtimeTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <div style="text-align: right; margin-top: 2rem; padding-bottom: 1rem; font-size: 0.75rem; color: var(--gray-500);">
        Himawari
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script>const BASE_URL = window.location.origin + '/backend/api';</script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/shared/toast.js"></script>
  <!-- Modal: Add Overtime -->
  <div class="modal" id="modalAddOvertime" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: white; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border-bottom: 1px solid var(--gray-200);">
        <h2 style="font-size: 1.125rem; font-weight: 600; color: var(--gray-900); margin: 0;">Add Overtime</h2>
        <button id="closeModalOvertime" style="background: transparent; border: none; font-size: 1.25rem; color: var(--gray-500); cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="padding: 1.5rem;">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">User</label>
          <select class="form-control" style="width: 100%;">
            <option value="Jude">Jude</option>
            <option value="Yashir">Yashir</option>
            <option value="Jimbo">Jimbo</option>
          </select>
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Date</label>
          <input type="date" class="form-control" style="width: 100%;">
        </div>
        <div style="margin-bottom: 1rem; display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Start Time</label>
            <input type="time" class="form-control" style="width: 100%;">
          </div>
          <div style="flex: 1;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">End Time</label>
            <input type="time" class="form-control" style="width: 100%;">
          </div>
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--gray-700); margin-bottom: 0.5rem;">Reason</label>
          <textarea class="form-control" style="width: 100%; min-height: 80px;"></textarea>
        </div>
      </div>
      <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 1rem; background: #f8fafc; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
        <button id="cancelModalOvertime" class="btn btn-outline" style="border: 1px solid var(--gray-300); background: white; color: var(--gray-700);">Cancel</button>
        <button id="saveModalOvertime" class="btn btn-primary" style="background: var(--primary-600); color: white;">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/shared/sidebar.js"></script>
  <script src="../js/shared/topbar.js"></script>
  <script src="../js/modules/overtime/overtime.js"></script>
</body>
</html>
