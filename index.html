<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Himawari Digi Creative</title>
  <meta name="description" content="Helpdesk Asset Management System — Login" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Global CSS -->
  <link rel="stylesheet" href="frontend/css/style.css" />
  <link rel="stylesheet" href="frontend/css/login.css" />
</head>

<body class="auth-body">

  <div class="auth-wrapper">

    <!-- Left Panel Branding -->
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-logo">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="brand-name">Himawari <span>Digi</span></h1>
        <p class="brand-tagline">Cost Control Test</p>
      </div>

      <div class="auth-features">
        <div class="feature-item">
          <i class="fa-solid fa-box-archive"></i>
          <span>Company Assets</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-ticket"></i>
          <span>Ticket System</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard Grafik</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-screwdriver-wrench"></i>
          <span>Jadwal Maintenance</span>
        </div>
      </div>

      <div class="auth-illustration">
        <div class="floating-card card-1">
          <i class="fa-solid fa-desktop"></i>
          <span>Assets </span>
        </div>
        <div class="floating-card card-2">
          <i class="fa-solid fa-circle-check"></i>
          <span>... Ticket Selesai</span>
        </div>
        <div class="floating-card card-3">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>... Perlu Perhatian</span>
        </div>
      </div>
    </div>

    <!-- Right Panel — Login Form -->
    <div class="auth-right">
      <div class="login-card">

        <div class="login-header">
          <h2>Selamat Datang</h2>
          <p>Masuk ke akun Anda untuk melanjutkan</p>
        </div>

        <!-- Alert Message -->
        <div class="alert-box" id="alertBox" style="display:none;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="alertMessage"></span>
        </div>

        <form id="loginForm" class="login-form" novalidate>

          <!-- Email -->
          <div class="form-group" id="emailGroup">
            <label for="email">
              <i class="fa-solid fa-envelope"></i>
              Email
            </label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" placeholder="nama@perusahaan.com" autocomplete="email"
                required />
            </div>
            <span class="field-error" id="emailError"></span>
          </div>

          <!-- Password -->
          <div class="form-group" id="passwordGroup">
            <label for="password">
              <i class="fa-solid fa-lock"></i>
              Password
            </label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" placeholder="Masukkan password"
                autocomplete="current-password" required />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <!-- Remember Me + Forgot -->
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" />
              <span class="checkmark"></span>
              Ingat Saya
            </label>
            <a href="#" class="forgot-link">Lupa Password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-login" id="btnLogin">
            <span id="btnText">Masuk</span>
            <span id="btnLoader" class="btn-loader" style="display:none;">
              <i class="fa-solid fa-spinner fa-spin"></i>
              Memproses...
            </span>
          </button>

        </form>



      </div>
    </div>

  </div>

  <!-- Config -->
  <script>
    const BASE_URL = window.location.origin + '/Project A/backend/api';
  </script>

  <!-- JS -->
  <script src="frontend/js/utils/storage.js"></script>
  <script src="frontend/js/utils/validator.js"></script>
  <script src="frontend/js/modules/auth/login.js"></script>

</body>
</html>
